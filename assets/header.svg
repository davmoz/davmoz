<svg xmlns="http://www.w3.org/2000/svg" width="840" height="220" viewBox="0 0 840 220" role="img" aria-label="David Mozart, co-founder and firmware developer at Sourceful">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset=".6" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0a2e1a"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#00ff84" stroke-opacity=".05"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .wire { stroke: #00ff84; stroke-width: 2; stroke-dasharray: 4 8; animation: flow .8s linear infinite; }
    .node { fill: #0d1117; stroke: #00ff84; stroke-opacity: .45; stroke-width: 1.5; }
    .icon { fill: none; stroke: #00ff84; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .label { fill: #7d8590; font-size: 11px; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -12; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 50% { opacity: .25; } }
  </style>

  <!-- card -->
  <rect x=".5" y=".5" width="839" height="219" rx="12" fill="url(#bg)" stroke="#30363d"/>
  <rect x=".5" y=".5" width="839" height="219" rx="12" fill="url(#grid)"/>

  <!-- window chrome -->
  <circle cx="22" cy="20" r="5" fill="#30363d"/>
  <circle cx="38" cy="20" r="5" fill="#30363d"/>
  <circle cx="54" cy="20" r="5" fill="#30363d"/>
  <g class="mono" font-size="11">
    <circle cx="772" cy="16" r="3.5" fill="#00ff84" class="pulse"/>
    <text x="782" y="20" fill="#7d8590">online</text>
  </g>

  <!-- left: who -->
  <g class="mono" font-size="14">
    <text x="40" y="72" fill="#7d8590">$ whoami<tspan fill="#00ff84" class="blink"> ▌</tspan></text>
  </g>
  <text x="38" y="120" class="sans" font-size="40" font-weight="700" fill="#e6edf3">David Mozart</text>
  <text x="40" y="152" class="mono" font-size="15" fill="#00ff84">co-founder &amp; firmware @ sourceful</text>
  <text x="40" y="178" class="mono" font-size="13" fill="#7d8590">building the decentralized energy grid</text>

  <!-- right: power flow -->
  <line x1="486" y1="110" x2="780" y2="110" stroke="#00ff84" stroke-opacity=".15" stroke-width="2"/>
  <line x1="486" y1="110" x2="780" y2="110" class="wire"/>
  <circle cy="110" r="4" fill="#00ff84" filter="url(#glow)">
    <animate attributeName="cx" values="486;780" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- solar -->
  <rect x="462" y="86" width="48" height="48" rx="10" class="node"/>
  <g transform="translate(486 110)" class="icon">
    <circle r="5.5"/>
    <g>
      <line y1="-9" y2="-13"/>
      <line y1="-9" y2="-13" transform="rotate(45)"/>
      <line y1="-9" y2="-13" transform="rotate(90)"/>
      <line y1="-9" y2="-13" transform="rotate(135)"/>
      <line y1="-9" y2="-13" transform="rotate(180)"/>
      <line y1="-9" y2="-13" transform="rotate(225)"/>
      <line y1="-9" y2="-13" transform="rotate(270)"/>
      <line y1="-9" y2="-13" transform="rotate(315)"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- battery -->
  <rect x="560" y="86" width="48" height="48" rx="10" class="node"/>
  <g transform="translate(584 110)">
    <rect x="-12" y="-7" width="22" height="14" rx="2" class="icon"/>
    <rect x="11" y="-3" width="3" height="6" rx="1" fill="#00ff84"/>
    <rect x="-9.5" y="-4.5" width="2" height="9" rx="1" fill="#00ff84">
      <animate attributeName="width" values="2;17;17" keyTimes="0;.8;1" dur="2.4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- gateway -->
  <rect x="658" y="86" width="48" height="48" rx="10" class="node"/>
  <g transform="translate(682 110)" class="icon">
    <rect x="-9" y="-9" width="18" height="18" rx="2"/>
    <path d="M-4 -9V-13M4 -9V-13M-4 9V13M4 9V13M-9 -4H-13M-9 4H-13M9 -4H13M9 4H13"/>
    <circle r="2.5" fill="#00ff84" stroke="none" class="blink"/>
  </g>

  <!-- cloud -->
  <rect x="756" y="86" width="48" height="48" rx="10" class="node"/>
  <g transform="translate(780 111)" class="icon">
    <path d="M-11 6a5 5 0 0 1 1-9.9a7.5 7.5 0 0 1 14-2a6 6 0 0 1 7 11.9Z"/>
  </g>

  <g class="mono label" text-anchor="middle">
    <text x="486" y="154">solar</text>
    <text x="584" y="154">battery</text>
    <text x="682" y="154">gateway</text>
    <text x="780" y="154">cloud</text>
  </g>
</svg>
